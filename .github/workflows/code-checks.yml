name: Kin City offline checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalogs and spatial geometry
        run: |
          python tools/validate_catalog.py
          python tools/validate_spatial.py
          python tools/art_deco_catalog.py
      - name: Rebuild official test installer and test sources
        run: |
          python tools/build_release.py
          python tools/art_deco_scene_audit.py --output build/art-deco-zone-audit.json
          python -m unittest discover -s tests -v
      - name: Ensure release artifacts are reproducible
        run: git diff --exit-code -- src/shared/ build/world-plan.json build/art-deco-zone-audit.json build/release-manifest.json installer/
